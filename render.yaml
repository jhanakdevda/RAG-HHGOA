# Render Blueprint Deployment Spec for HH Goa RAG Backend
services:
  - type: web
    name: hh-goa-rag-backend
    env: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: "pip install --no-cache-dir -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
